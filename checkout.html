<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout — BloomCart</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><a class="brand" href="index.html"><span>🌷</span> BloomCart</a><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About</a><a class="active" href="cart.html">Cart <b class="badge">0</b></a></nav></header>
<main class="section"><div class="page-title"><p class="kicker">CHECKOUT</p><h1>Almost there 💗</h1><p>Review your information before placing your order.</p></div>
<form id="checkoutForm" class="form-card">
<label>Full Name<input required name="name" placeholder="Your full name"></label><label>Phone Number<input required name="phone" placeholder="09XX XXX XXXX"></label><label>Address<textarea required name="address" rows="4" placeholder="Delivery address"></textarea></label><label>Delivery Date<input required type="date" name="date"></label><label>Delivery Time<select name="time"><option>10:00 AM - 12:00 PM</option><option>1:00 PM - 3:00 PM</option><option>4:00 PM - 6:00 PM</option></select></label><fieldset><legend>Payment Method</legend><label><input type="radio" name="payment" value="Cash on Delivery" checked> Cash on Delivery</label><label><input type="radio" name="payment" value="GCash"> GCash</label><label><input type="radio" name="payment" value="Bank Transfer"> Bank Transfer</label></fieldset>
<button class="btn" type="submit">PLACE ORDER</button></form></main><footer><strong>BloomCart</strong><p>Thank you for choosing BloomCart.</p></footer><script src="script.js"></script></body></html>

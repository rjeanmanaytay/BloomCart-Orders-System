<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Customize — BloomCart</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><a class="brand" href="index.html"><span>🌷</span> BloomCart</a><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About</a><a href="cart.html">Cart <b class="badge">0</b></a></nav></header>
<main class="section"><div class="page-title"><p class="kicker">CUSTOMIZE YOUR WAY</p><h1>Make it uniquely yours 🎀</h1></div>
<form id="customForm" class="form-card">
<label>Flower color<select id="flowerColor"><option>Pink</option><option>Red</option><option>White</option><option>Peach</option><option>Lavender</option></select></label>
<label>Arrangement style<select id="arrangement"><option>Classic Bouquet</option><option>Round Bouquet</option><option>Gift Box</option></select></label>
<label>Wrap paper<select id="wrap"><option>Blush Pink</option><option>Cream</option><option>Soft Lavender</option><option>Sage Green</option></select></label>
<label>Ribbon<select id="ribbon"><option>Pink Satin</option><option>Rose Red</option><option>White</option><option>Lavender</option></select></label>
<label>Message on card<textarea id="message" rows="5" maxlength="120" placeholder="Happy Birthday! May your day bloom with joy..."></textarea></label>
<button class="btn" type="submit">SAVE CUSTOMIZATION</button>
</form></main><footer><strong>BloomCart</strong><p>Personalized with love.</p></footer><script src="script.js"></script></body></html>
